<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7fc6e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pinball Pilgrim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%23c6d0d9' stroke='%233b2a22' stroke-width='2.5'/%3E%3Crect x='9' y='11' width='18' height='8' rx='4' fill='%232b2230'/%3E%3Ccircle cx='15' cy='15' r='2' fill='%23fff'/%3E%3Ccircle cx='22' cy='15' r='2' fill='%23fff'/%3E%3Cpath d='M15 5C13-3 3 0 2 6c6-2 9 0 15 0z' fill='%23d8432f' stroke='%233b2a22' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game" aria-label="Pinball Pilgrim game"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <div id="hud">
    <div id="score">
      <div id="dist"><span id="distVal">0</span><small>m</small></div>
      <div id="best">Best <span id="bestVal">0</span> m</div>
      <div id="chain" hidden>Chain <b id="chainVal">2</b></div>
    </div>

    <div id="topbar">
      <button id="btnRestart" class="round" aria-label="Restart run" title="Restart (R)">
        <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.3-5.2M5 4v4.2h4.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnSound" class="round" aria-label="Sound settings" aria-expanded="false" title="Sound">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path id="soundWaves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path id="soundOff" d="M15.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" hidden/></svg>
      </button>
      <div id="soundPanel" class="panel" hidden>
        <label class="row"><span>Volume</span><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"></label>
        <button id="btnMute" class="btn small" aria-pressed="false">Mute</button>
      </div>
    </div>

    <div id="region" aria-live="polite"></div>
    <div id="tip" aria-live="polite"></div>

    <div id="actions" hidden>
      <button id="btnShield" class="action" aria-label="Shield">
        <svg viewBox="0 0 32 32"><path d="M16 3l11 4v8c0 7-4.6 11.5-11 14C9.6 26.500 5 22 5 15V7z" fill="#bfe9ff" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M16 8v16M10 14h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="label">Shield</span>
        <span class="pips" id="shieldPips"></span>
      </button>
      <button id="btnKick" class="action big" aria-label="Kick">
        <svg viewBox="0 0 32 32"><path d="M9 4h9v12l8 4c2 1 3 2.600 3 5v2H7c-1.500-3-1.500-6 0-9z" fill="#f4c542" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M2 10h4M1 16h4M2 22h3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="label">Kick</span>
        <span class="pips" id="kickPips"></span>
      </button>
    </div>
  </div>

  <div id="title">
    <h1><span>Pinball</span> <span>Pilgrim</span></h1>
    <p class="sub">A small knight. A large catapult. A very long way down the road.</p>
    <p class="how">Drag back, aim, release</p>
    <button id="btnWardrobe" class="btn small">Wardrobe</button>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="panel card">
      <div id="ribbon" hidden>New record!</div>
      <h2 id="resultTitle">Journey's end</h2>
      <div class="bigdist"><span id="resultDist">0</span><small>m</small></div>
      <div id="resultBest" class="muted"></div>
      <ul id="stats"></ul>
      <div id="unlocks"></div>
      <div class="buttons">
        <button id="btnAgain" class="btn primary">Launch again</button>
        <button id="btnWardrobe2" class="btn">Wardrobe</button>
      </div>
      <button id="btnSame" class="link"></button>
    </div>
  </div>

  <div id="wardrobe" class="overlay" hidden>
    <div class="panel card">
      <h2>Wardrobe</h2>
      <p class="muted">Travel farther to earn new colours.</p>
      <h3>Plume &amp; cape colour</h3>
      <div id="helmets" class="swatches"></div>
      <h3>Cape pattern</h3>
      <div id="capes" class="swatches"></div>
      <div class="buttons"><button id="btnWardrobeClose" class="btn primary">Done</button></div>
    </div>
  </div>

  <noscript>Pinball Pilgrim needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
